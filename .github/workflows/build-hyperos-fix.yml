name: Build HyperOS Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - hyperos-keyboard-fix

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK files
        if: success()
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trime-v3.3.11-hyperos-fix
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
